packages_path: /home/andromeda/cobaya_packages

theory:
  camb:
    path: /home/andromeda/cosmo_practice/CAMB_DETG
    extra_args:
      lens_potential_accuracy: 4      # ACT DR6 官方建議值
      lens_margin: 1250
      num_massive_neutrinos: 1        # 與 act_lens / hsc_lens mass_split: single
      halofit_version: mead           # HMCode
      HMCode_DETG_p: 3
    stop_at_error: true

likelihood:
  planck_2018_highl_plik.TTTEEE_lite_native: null
#   bao.desi_2024_bao_all: null

  act_lens.ACTDR6LensDETG:
    python_path: /home/andromeda/cosmo_practice/test_cobaya/scripts
    variant: act_baseline
    lens_only: false                  # 與 primary CMB 合併時，ACT 建議 lens_only=false（會載入 like_corrs，約 0.6 GB）
    growth_model: detg
    p_detg: 3.0
    mass_split: single                # act_lens.py 的預設是 "normal"，驗證時用的是 "single"
    varying_cmb_alens: true
    apply_growth_ratio: false         # A_L 已做detg修正，不再額外套用 growth_ratio
    stop_at_error: true

  hsc_lens.HSC_Lens:
    python_path: /home/andromeda/cosmo_practice/test_cobaya/scripts
    data_folder: /home/andromeda/cosmo_practice/test_cobaya/fiducial
    dataset_file: dataset_hsc_y3_fixed.fits
    psf_file: dataset/psf_pp_pq_qq_used.dat
    sumwlssig_files:
      - dataset/sumwlssigcritinvPz_z0.dat
      - dataset/sumwlssigcritinvPz_z1.dat
      - dataset/sumwlssigcritinvPz_z2.dat
    zsbin_file: dataset/photoz_bin.dat
    growth_model: detg
    p_detg: 3.0                       # 必須與 ACT 的 p_detg 相同
    mass_split: single
    n_sim: 1391
    binave: true
    stop_at_error: true

params:
  mnu: 0.06
  Alens: 1.0
#   Alens: {prior: {min: 0.5, max: 1.5}, ref: 1.0, proposal: 0.03, latex: 'A_L'}
  ombh2: {prior: {min: 0.017, max: 0.027}, ref: 0.02237, proposal: 0.0001,
          latex: '\Omega_b h^2'}
  omch2: {prior: {min: 0.05, max: 0.20}, ref: 0.1200, proposal: 0.001,
          latex: '\Omega_c h^2'}
  H0:    {prior: {min: 50, max: 90}, ref: 67.4, proposal: 0.4, latex: 'H_0'}   # 放寬：HSC 單獨偏好 H0<60（見 joint notebook B6）
  ns:    {prior: {min: 0.8, max: 1.2}, ref: 0.9649, proposal: 0.004,
          latex: 'n_s'}
  logA:  {prior: {min: 1.61, max: 3.91}, ref: 3.044, proposal: 0.01,
          drop: true, latex: '\ln(10^{10} A_s)'}
  As:    {value: 'lambda logA: 1e-10*np.exp(logA)', derived: true,
          latex: 'A_s'}
  tau:   {prior: {dist: norm, loc: 0.0544, scale: 0.0073}, ref: 0.0544,
                  proposal: 0.003, latex: '\tau_{\rm reio}'}
  beta_detg: {prior: {min: -1.0, max: 1.0}, ref: {dist: norm, 
              loc: 0.0, scale: 0.05}, proposal: 0.05, latex: \beta}

  # ---- galaxy bias ----
  b1: {prior: {min: 0.5, max: 5.0}, ref: 1.92, proposal: 0.1, latex: 'b_1'}
  b2: {prior: {min: 0.5, max: 5.0}, ref: 2.32, proposal: 0.1, latex: 'b_2'}
  b3: {prior: {min: 0.5, max: 5.0}, ref: 2.53, proposal: 0.1, latex: 'b_3'}

  # ---- IA / shear / photo-z ----
  AIA:   {prior: {min: -5.0, max: 5.0}, ref: 0.0, proposal: 0.5,
          latex: 'A_{\rm IA}'}
  dm_0:  {prior: {dist: norm, loc: 0.0, scale: 0.01},
          ref: {dist: norm, loc: 0.0, scale: 0.005}, proposal: 0.005,
          latex: '\Delta m'}
  dpz_0: {prior: {dist: norm, loc: -0.0529, scale: 0.0911},   # analysis_config
          ref: {dist: norm, loc: -0.0529, scale: 0.05}, proposal: 0.03,
          latex: '\Delta z_{\rm ph}'}

  # ---- PSF systematics (NEW; required by fiducial analysis) ----
  alphapsf: {prior: {dist: norm, loc: -0.0264, scale: 0.0103},  # analysis_config
             ref: -0.0264, proposal: 0.01, latex: '\alpha_{\rm psf}'}
  betapsf:  {prior: {dist: norm, loc: -1.656, scale: 1.326},    # analysis_config
             ref: -1.656, proposal: 0.5, latex: '\beta_{\rm psf}'}

  # ---- magnification bias (NOW SAMPLED; means from More+2023) ----
  alphamag_1: {prior: {dist: norm, loc: 2.259, scale: 0.5},
               ref: 2.259, proposal: 0.2, latex: '\alpha_{\rm mag,1}'}
  alphamag_2: {prior: {dist: norm, loc: 3.563, scale: 0.5},
               ref: 3.563, proposal: 0.2, latex: '\alpha_{\rm mag,2}'}
  alphamag_3: {prior: {dist: norm, loc: 3.729, scale: 0.5},
               ref: 3.729, proposal: 0.2, latex: '\alpha_{\rm mag,3}'}

  # ---- derived ----
  HMCode_DETG_beta: {value: 'lambda beta_detg: beta_detg',
                     derived: false, latex: '\beta^{\rm DETG}'}
  om_m:   {derived: 'lambda omch2, ombh2, H0: (omch2+ombh2+0.06/93.14)/(H0/100)**2',
           latex: '\Omega_m'}
  sigma8:  {derived: true, latex: '\sigma_8^{\rm DETG}'}
  S8:      {derived: true, latex: 'S_8^{\rm DETG}'}
  S8_z_L1: {derived: true, latex: 'S_8(z_{L1})'}
  S8_z_L2: {derived: true, latex: 'S_8(z_{L2})'}
  S8_z_L3: {derived: true, latex: 'S_8(z_{L3})'}

sampler:
  evaluate:
    override:
      beta_detg: 0.0
      dpz_0: -0.0529
      dm_0: 0.0
      AIA: 0.0
      A_planck: 1.0
  # mcmc:
  #   covmat: auto           # or the published parameter covariance
  #   Rminus1_stop: 0.02
  #   max_samples: 500000

output: /home/andromeda/cosmo_practice/test_cobaya/chains/detg_hsc_act_AL/run
